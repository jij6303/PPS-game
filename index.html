<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>달이의 조달 창구 (가제)</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 기준 해상도 1920×1080 무대. main.js가 창 크기에 맞춰 비율 유지 스케일한다. -->
  <div id="stage">

    <section class="screen" data-screen="title">
      <div class="title-card">
        <p class="title-badge">2026 조달청 AI 게임 공모전</p>
        <h1 class="title-name">달이의 조달 창구<span class="title-tentative">가제</span></h1>
        <p class="title-sub">신입 조달관 달이와 AI 비서 나르미의 공정 심사</p>
        <button class="btn btn-primary" type="button" data-action="start">시작하기</button>
      </div>
      <img class="mascot mascot-dali" src="assets/img/dali_3d.png" alt="달이">
      <img class="mascot mascot-narmi" src="assets/img/narmi_3d.png" alt="나르미">
    </section>

    <!-- ① 사업 공고 -->
    <section class="screen" data-screen="notice">
      <div class="notice-wrap">
        <div class="notice-card" id="notice-card"></div>
        <div class="notice-side">
          <img class="notice-dali" src="assets/img/dali_3d.png" alt="달이">
          <div class="bubble" id="notice-bubble"></div>
          <button class="btn btn-primary" type="button" data-action="begin-review">심사 시작</button>
        </div>
      </div>
    </section>

    <!-- ②~④ 심사 데스크 -->
    <section class="screen" data-screen="desk">
      <header class="desk-top">
        <h2 class="desk-title" id="desk-title"></h2>
        <ol class="desk-progress" id="desk-progress"></ol>
      </header>

      <div class="desk-body">
        <aside class="counter">
          <div class="counter-label">창구</div>
          <div class="rep" id="rep"></div>
          <div class="bubble bubble-up" id="rep-bubble"></div>
        </aside>

        <main class="papers">
          <nav class="doc-tabs" id="doc-tabs"></nav>
          <div class="doc-area" id="doc-area"></div>
          <div class="stamp-mark" id="stamp-mark"></div>
        </main>

        <aside class="side">
          <section class="conditions" id="conditions"></section>
          <section class="narmi">
            <img class="narmi-img" src="assets/img/narmi_3d.png" alt="나르미">
            <div class="narmi-talk">
              <div class="bubble bubble-left" id="narmi-bubble"></div>
              <button class="hint-btn" type="button" data-action="hint" id="hint-btn">힌트</button>
            </div>
          </section>
        </aside>
      </div>

      <footer class="stamps">
        <button class="stamp-btn stamp-ok" type="button" data-action="stamp-ok">적격</button>
        <button class="stamp-btn stamp-reject" type="button" data-action="stamp-reject">부적격</button>
      </footer>

      <div class="modal" id="reason-modal" hidden>
        <div class="modal-card">
          <h3>부적격 사유를 골라 주세요</h3>
          <div class="reason-list" id="reason-list"></div>
          <div class="modal-actions">
            <button class="btn" type="button" data-action="cancel-reject">취소</button>
            <button class="btn btn-reject" type="button" data-action="confirm-reject" id="confirm-reject" disabled>부적격 도장 찍기</button>
          </div>
        </div>
      </div>

      <!-- 사유를 틀렸을 때 나르미 안내 (GAME_SPEC 4.2) -->
      <div class="modal" id="narmi-modal" hidden>
        <div class="modal-card narmi-card">
          <img class="narmi-img" src="assets/img/narmi_3d.png" alt="나르미">
          <div class="narmi-card-body">
            <p class="narmi-card-text" id="narmi-modal-text"></p>
            <button class="btn btn-primary" type="button" data-action="narmi-ok">알겠어요</button>
          </div>
        </div>
      </div>
    </section>

    <!-- ⑤ 낙찰 선택 -->
    <section class="screen" data-screen="award">
      <h2 class="award-title">낙찰 업체를 골라 주세요</h2>
      <p class="award-dilemma" id="award-dilemma"></p>
      <div class="award-cards" id="award-cards"></div>
      <div class="award-narmi">
        <img class="narmi-img" src="assets/img/narmi_3d.png" alt="나르미">
        <div class="bubble bubble-left" id="award-bubble"></div>
      </div>
    </section>

    <!-- 임시 결과 (M1) -->
    <section class="screen" data-screen="result">
      <h2 class="result-title">심사 결과</h2>
      <div class="result-body">
        <div class="result-table-wrap" id="result-table"></div>
        <div class="result-side" id="result-side"></div>
      </div>
      <div class="result-actions">
        <button class="btn btn-primary" type="button" data-action="restart">처음으로</button>
      </div>
    </section>

  </div>

  <!-- file://에서도 동작하도록 type="module" 없이 순서대로 로드한다 (GAME_SPEC 9장). -->
  <script src="js/data.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
