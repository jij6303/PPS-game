<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>달이의 조달 창구</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 기준 해상도 1920×1080 무대. main.js가 창 크기에 맞춰 비율 유지 스케일한다. -->
  <div id="stage">

    <section class="screen" data-screen="title">
      <div class="title-card">
        <img class="pps-symbol title-symbol" src="assets/img/pps_symbol_h.jpg" alt="조달청">
        <p class="title-badge">2026 조달청 AI 게임 공모전</p>
        <h1 class="title-name">달이의 조달 창구</h1>
        <p class="title-sub">신입 조달관 달이와 AI 비서 나르미의 공정 심사</p>
        <div class="title-actions">
          <button class="btn btn-continue" type="button" data-action="continue" id="continue-btn" hidden></button>
          <button class="btn btn-primary" type="button" data-action="start">시작하기</button>
        </div>
      </div>
      <img class="mascot mascot-dali" src="assets/img/dali_3d.png" alt="달이">
      <img class="mascot mascot-narmi" src="assets/img/narmi_3d.png" alt="나르미">
    </section>

    <!-- 이야기: 달이의 첫 출근 (화면 아무 곳이나 누르면 다음 컷). data-scene에 맞는 배경만 보인다. -->
    <section class="screen" data-screen="intro" data-action="intro-next" data-scene="home">
      <!-- 달이의 집 -->
      <div class="scene scene-home" aria-hidden="true">
        <div class="home-window"><div class="home-sun"></div></div>
        <div class="home-frame"></div>
        <div class="home-floor"></div>
        <div class="home-bed"><div class="home-pillow"></div><div class="home-blanket"></div></div>
        <div class="home-table"><div class="home-clock"><span>7:30</span></div></div>
        <div class="home-rug"></div>
      </div>
      <!-- 출근길 -->
      <div class="scene scene-street" aria-hidden="true">
        <div class="street-sun"></div>
        <div class="street-cloud is-a"></div><div class="street-cloud is-b"></div>
        <div class="street-city"><i></i><i></i><i></i><i></i><i></i><i></i></div>
        <div class="street-tree is-a"></div><div class="street-tree is-b"></div><div class="street-tree is-c"></div>
        <div class="street-lamp"></div>
        <div class="street-stop"><div class="street-stop-sign">버스</div><div class="street-bench"></div></div>
        <div class="street-walk"></div>
        <div class="street-road"></div>
      </div>
      <!-- 조달청 건물 (일하는 곳) -->
      <div class="scene scene-building" aria-hidden="true">
        <div class="bld-cloud is-a"></div><div class="bld-cloud is-b"></div>
        <div class="bld">
          <div class="bld-windows"></div>
          <!-- 정부상징은 원본 그대로 흰 현판 위에만 -->
          <div class="bld-plate"><img src="assets/img/pps_symbol_h.jpg" alt=""></div>
          <div class="bld-door"></div>
        </div>
        <div class="bld-steps"></div>
        <div class="bld-ground"></div>
        <div class="bld-tree is-a"></div><div class="bld-tree is-b"></div>
      </div>
      <!-- 업무 장소 (사무실 — 아래 office 화면과 같은 방) -->
      <!-- 방 그림은 ui.buildIntroRoom()이 업무 장소 화면의 방을 복사해 채운다 (두 곳이 항상 같게) -->
      <div class="scene scene-office" aria-hidden="true" id="intro-room"></div>
      <p class="scene-tag" id="scene-tag"></p>

      <img class="intro-char intro-dali" id="intro-dali" src="assets/img/dali_3d.png" alt="달이">
      <img class="intro-char intro-narmi" id="intro-narmi" src="assets/img/narmi_3d.png" alt="나르미">
      <button class="btn intro-skip" type="button" data-action="intro-skip">건너뛰기</button>
      <div class="intro-box">
        <span class="intro-name" id="intro-name"></span>
        <p class="intro-text" id="intro-text"></p>
        <div class="intro-foot">
          <ol class="intro-dots" id="intro-dots"></ol>
          <span class="intro-next">▶ 다음</span>
        </div>
      </div>
    </section>

    <!-- 업무 장소(사무실): 게임의 중심 화면. 책상을 누르면 공고 → 심사 (배치: docs/office_layout.png) -->
    <section class="screen" data-screen="office">
      <div class="room" id="office-room">
        <!-- 벽·바닥 -->
        <div class="room-wall"></div>
        <div class="room-wainscot"></div>
        <div class="room-floor"></div>
        <div class="room-rug"></div>
        <div class="room-ceiling"><i class="room-lamp is-a"></i><i class="room-lamp is-b"></i></div>
        <!-- 문 -->
        <button class="room-door" type="button" data-action="office-spot" data-spot="door" aria-label="문">
          <span class="door-glass"></span><span class="door-plate">민원 접수</span><i></i>
        </button>
        <!-- 액자: 정부상징은 원본 그대로 흰 바탕 위에 -->
        <div class="room-poster"><img src="assets/img/pps_symbol_v.jpg" alt=""><span>공정한 조달</span></div>
        <div class="room-plant"><i></i><i></i><i></i></div>
        <!-- 창문 -->
        <button class="room-window" type="button" data-action="office-spot" data-spot="window" aria-label="창문">
          <span class="win-city"><i></i><i></i><i></i><i></i><i></i></span><b></b><b></b>
        </button>
        <div class="room-valance"></div>
        <div class="room-clock"><i></i><i></i></div>
        <!-- 책장: 누르면 조달 용어 사전 -->
        <button class="room-shelf" type="button" data-action="glossary" aria-label="책장 — 조달 용어 사전">
          <span class="shelf-row"><i></i><i></i><i></i><i></i><i></i><i></i></span>
          <span class="shelf-row"><i></i><i></i><i></i><i></i><i></i></span>
          <span class="shelf-top"></span>
          <span class="shelf-label" id="shelf-label"></span>
        </button>
        <!-- 나르미: 작은 AI 받침대 위에 -->
        <button class="room-narmi" type="button" data-action="office-spot" data-spot="narmi" aria-label="나르미에게 묻기">
          <span class="narmi-pad">AI</span>
          <img src="assets/img/narmi_3d.png" alt="나르미">
        </button>
        <!-- 책상: 위에 컴퓨터(모니터·키보드·마우스). 컴퓨터를 누르면 바탕화면에서 업무 고르기 -->
        <div class="room-desk">
          <span class="desk-tray"><i></i><i></i><i></i></span>
          <span class="desk-stamp"></span>
          <span class="desk-ink"></span>
          <span class="desk-mug"></span>
          <span class="desk-pens"><i></i><i></i><i></i></span>
          <span class="desk-sprout"></span>
          <span class="desk-nameplate">신입 조달관 달이</span>
          <button class="desk-pc" type="button" data-action="office-pc" aria-label="컴퓨터 — 업무 고르기">
            <span class="pc-monitor"><span class="pc-screen" id="pc-mini"></span></span>
            <span class="pc-stand"></span>
            <span class="pc-keyboard"></span>
            <span class="pc-mouse"></span>
            <span class="desk-label" id="desk-label"></span>
          </button>
        </div>
      </div>
      <p class="scene-tag">업무 장소</p>
      <div class="office-prompt" id="office-prompt"></div>
      <div class="office-tip" id="office-tip" hidden></div>
    </section>

    <!-- 컴퓨터 바탕화면: 사업 폴더를 골라 업무 시작 (어떤 순서로든) -->
    <section class="screen" data-screen="computer">
      <div class="pc-frame">
        <div class="pc-desktop" id="pc-desktop">
          <header class="pc-topbar" id="pc-topbar"></header>
          <div class="pc-icons" id="pc-icons"></div>
          <div class="pc-window" id="pc-window" hidden></div>
          <div class="pc-tour" id="pc-tour" hidden>
            <div class="pc-tour-spot" id="pc-tour-spot"></div>
            <div class="pc-tour-bubble" id="pc-tour-bubble">
              <img class="pc-tour-narmi" src="assets/img/narmi_3d.png" alt="나르미">
              <p class="pc-tour-text" id="pc-tour-text"></p>
              <div class="pc-tour-foot">
                <span class="pc-tour-count" id="pc-tour-count"></span>
                <button class="pc-tour-skip" type="button" data-action="tour-skip" id="pc-tour-skip"></button>
                <button class="btn btn-primary pc-tour-next" type="button" data-action="tour-next" id="pc-tour-next"></button>
              </div>
            </div>
          </div>
          <footer class="pc-taskbar">
            <button class="pc-off" type="button" data-action="pc-off" id="pc-off"></button>
            <span class="pc-hint" id="pc-hint"></span>
            <button class="pc-help" type="button" data-action="tour-start" id="pc-help"></button>
            <span class="pc-clock">09:00</span>
          </footer>
        </div>
      </div>
      <div class="pc-base"></div>
    </section>

    <!-- ① 사업 공고 -->
    <section class="screen" data-screen="notice">
      <div class="notice-wrap">
        <div class="notice-card" id="notice-card"></div>
        <div class="notice-side">
          <img class="notice-dali" src="assets/img/dali_3d.png" alt="달이">
          <div class="bubble" id="notice-bubble"></div>
          <!-- 새 확인 사항·조작 안내는 심사 전에 여기서 (심사 중에는 나르미가 말하지 않음) -->
          <div class="notice-narmi" id="notice-narmi" hidden>
            <img class="narmi-img" src="assets/img/narmi_3d.png" alt="나르미">
            <div class="bubble bubble-left" id="notice-narmi-bubble"></div>
          </div>
          <div class="notice-actions">
            <button class="btn" type="button" data-action="back-to-pc" id="back-to-pc">‹ 바탕화면</button>
            <button class="btn btn-primary" type="button" data-action="begin-review">심사 시작</button>
          </div>
        </div>
      </div>
    </section>

    <!-- ②~④ 심사 데스크 -->
    <section class="screen" data-screen="desk">
      <header class="desk-top">
        <h2 class="desk-title" id="desk-title"></h2>
        <ol class="desk-progress" id="desk-progress"></ol>
      </header>

      <div class="desk-body">
        <aside class="counter">
          <div class="counter-label">창구</div>
          <div class="rep" id="rep"></div>
          <div class="bubble bubble-up" id="rep-bubble"></div>
          <!-- 판정 도장: 창구 아래 빈자리에 (서류 공간을 넓히려고 하단 띠를 없앰) -->
          <div class="stamps">
            <button class="stamp-btn stamp-ok" type="button" data-action="stamp-ok">적격</button>
            <button class="stamp-btn stamp-reject" type="button" data-action="stamp-reject">부적격</button>
          </div>
        </aside>

        <!-- 세로 화면에서만 보이는 전환 탭 (GAME_SPEC 8장: 서류와 조건표를 탭으로 전환) -->
        <nav class="pane-switch" role="tablist">
          <button class="pane-btn is-active" type="button" role="tab" data-action="pane" data-pane="papers">서류</button>
          <button class="pane-btn" type="button" role="tab" data-action="pane" data-pane="conditions">공고 조건표</button>
        </nav>

        <main class="papers">
          <nav class="doc-tabs" id="doc-tabs"></nav>
          <div class="doc-area" id="doc-area"></div>
          <!-- 표시 도구: 서류 위에 직접 그리며 확인 (판정에는 영향 없음) -->
          <div class="draw-tools" role="toolbar" aria-label="표시 도구">
            <button class="tool-btn is-active" type="button" data-action="tool" data-tool="move" aria-pressed="true" title="서류 옮기기">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2v20M2 12h20M12 2l-3 3M12 2l3 3M12 22l-3-3M12 22l3-3M2 12l3-3M2 12l3 3M22 12l-3-3M22 12l-3 3"/></svg>
              <span>이동</span>
            </button>
            <button class="tool-btn" type="button" data-action="tool" data-tool="pen" aria-pressed="false" title="펜으로 표시">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path class="fill-red" d="M4 20l1.5-5L16 4.5l3.5 3.5L9 18.5z"/><path d="M14 6.5l3.5 3.5M4 20l5-1.5"/></svg>
              <span>펜</span>
            </button>
            <button class="tool-btn" type="button" data-action="tool" data-tool="marker" aria-pressed="false" title="형광펜으로 칠하기">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path class="fill-yellow" d="M7 14l8-10 5 4-8 10z"/><path d="M7 14l-1 4 3 1 3-1M3 21h9"/></svg>
              <span>형광펜</span>
            </button>
            <button class="tool-btn" type="button" data-action="tool" data-tool="eraser" aria-pressed="false" title="지우개로 지우기">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path class="fill-pink" d="M3 15l9-9 7 7-6 6H7z"/><path d="M8 10l7 7M7 19h13"/></svg>
              <span>지우개</span>
            </button>
            <button class="tool-btn tool-clear" type="button" data-action="clear-marks" title="서류와 조건표의 표시 모두 지우기">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6"/></svg>
              <span>모두 지우기</span>
            </button>
          </div>
          <div class="stamp-mark" id="stamp-mark"></div>
        </main>

        <aside class="side">
          <section class="conditions" id="conditions"></section>
          <section class="narmi">
            <img class="narmi-img" src="assets/img/narmi_3d.png" alt="나르미">
            <div class="narmi-talk">
              <!-- 심사 중에는 말하지 않고, 힌트를 눌렀을 때만 힌트 한 줄을 보여 준다 -->
              <div class="bubble bubble-left" id="narmi-bubble" hidden></div>
              <button class="hint-btn" type="button" data-action="hint" id="hint-btn">힌트</button>
            </div>
          </section>
        </aside>
      </div>

      <div class="modal" id="reason-modal" hidden>
        <div class="modal-card">
          <h3>부적격 사유를 골라 주세요</h3>
          <div class="reason-list" id="reason-list"></div>
          <div class="modal-actions">
            <button class="btn" type="button" data-action="cancel-reject">취소</button>
            <button class="btn btn-reject" type="button" data-action="confirm-reject" id="confirm-reject" disabled>부적격 도장 찍기</button>
          </div>
        </div>
      </div>

      <!-- 사유를 틀렸을 때 나르미 안내 (GAME_SPEC 4.2) -->
      <div class="modal" id="narmi-modal" hidden>
        <div class="modal-card narmi-card">
          <img class="narmi-img" src="assets/img/narmi_3d.png" alt="나르미">
          <div class="narmi-card-body">
            <p class="narmi-card-text" id="narmi-modal-text"></p>
            <button class="btn btn-primary" type="button" data-action="narmi-ok">알겠어요</button>
          </div>
        </div>
      </div>
    </section>

    <!-- ⑤ 낙찰 선택 -->
    <section class="screen" data-screen="award">
      <h2 class="award-title">낙찰 업체를 골라 주세요</h2>
      <p class="award-dilemma" id="award-dilemma"></p>
      <div class="award-cards" id="award-cards"></div>
      <div class="award-narmi">
        <img class="narmi-img" src="assets/img/narmi_3d.png" alt="나르미">
        <div class="bubble bubble-left" id="award-bubble"></div>
      </div>
    </section>

    <!-- 엔딩 ① 1년 후 조달 뉴스 (GAME_SPEC 7.1) -->
    <section class="screen" data-screen="news">
      <article class="paper-news">
        <header class="news-mast" id="news-mast"></header>
        <div class="news-lead" id="news-lead"></div>
        <div class="news-grid" id="news-grid"></div>
      </article>
      <div class="news-actions">
        <button class="btn btn-primary" type="button" data-action="show-title">내 칭호 받기</button>
      </div>
    </section>

    <!-- 엔딩 ② 칭호 카드 (GAME_SPEC 7.2) — 캡처·공유용 한 장 -->
    <section class="screen" data-screen="ending">
      <div class="ending-card" id="ending-card"></div>
      <img class="ending-dali" src="assets/img/dali_3d.png" alt="달이">
      <img class="ending-narmi" src="assets/img/narmi_3d.png" alt="나르미">
      <div class="ending-actions">
        <button class="btn" type="button" data-action="show-record">심사 기록 보기</button>
        <button class="btn" type="button" data-action="save-card" id="save-card-btn">이미지로 저장</button>
        <button class="btn btn-primary" type="button" data-action="restart">다시 하기</button>
      </div>

      <!-- 칭호 카드 이미지 저장 결과 (내려받기가 안 되는 기기에서는 길게 눌러 저장) -->
      <div class="modal" id="card-modal" hidden>
        <div class="modal-card card-preview">
          <h3>칭호 카드를 저장했어요!</h3>
          <img id="card-preview-img" alt="칭호 카드 이미지">
          <p class="card-preview-tip">저장이 안 됐다면 이미지를 길게 누르거나 오른쪽 클릭해서 저장해 주세요.</p>
          <div class="modal-actions">
            <button class="btn btn-primary" type="button" data-action="close-card">닫기</button>
          </div>
        </div>
      </div>
    </section>

    <!-- 심사 기록 (사업별 판정 상세) -->
    <section class="screen" data-screen="result">
      <h2 class="result-title">심사 기록</h2>
      <div class="result-body">
        <div class="result-table-wrap" id="result-table"></div>
        <div class="result-side" id="result-side"></div>
      </div>
      <div class="result-actions">
        <button class="btn" type="button" data-action="back-to-ending">칭호로 돌아가기</button>
        <button class="btn" type="button" data-action="glossary">용어 사전</button>
        <button class="btn btn-primary" type="button" data-action="restart">다시 하기</button>
      </div>

      <!-- 판정 복기: 표시를 누르면 그 업체의 근거 서류와 나르미 설명 -->
      <div class="modal" id="review-modal" hidden>
        <div class="modal-card review-card" role="dialog" aria-label="판정 복기">
          <div id="review-body"></div>
          <div class="review-nav">
            <button class="btn" type="button" data-action="review-prev" id="review-prev">‹ 이전 업체</button>
            <span class="review-pos" id="review-pos"></span>
            <button class="btn" type="button" data-action="review-next" id="review-next">다음 업체 ›</button>
            <button class="btn btn-primary" type="button" data-action="close-review">닫기</button>
          </div>
        </div>
      </div>
    </section>

    <!-- 조달 용어 사전 (어느 화면에서나 열 수 있는 창) -->
    <div class="modal glossary-modal" id="glossary-modal" hidden>
      <div class="modal-card glossary-card" role="dialog" aria-labelledby="glossary-title">
        <header class="glossary-head">
          <h3 id="glossary-title"></h3>
          <span class="glossary-count" id="glossary-count"></span>
          <button class="pc-window-close" type="button" data-action="close-glossary" aria-label="용어 사전 닫기">×</button>
        </header>
        <div class="glossary-body">
          <div class="glossary-list" id="glossary-list"></div>
          <article class="glossary-detail" id="glossary-detail"></article>
        </div>
      </div>
    </div>

    <!-- 새 용어 카드 알림 -->
    <div class="toast" id="toast" hidden></div>

    <!-- 소리 켜기/끄기 (모든 화면 왼쪽 아래) -->
    <button class="sound-btn" id="sound-btn" type="button" data-action="toggle-sound" aria-pressed="true" title="소리 끄기">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path class="spk" d="M4 9h4l5-4v14l-5-4H4z"/>
        <path class="wave" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12"/>
        <path class="mute" d="M16 9l5 6M21 9l-5 6"/>
      </svg>
