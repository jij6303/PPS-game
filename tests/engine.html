<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>엔진 테스트</title>
  <style>
    :root { --bg: #fdf6ec; --ink: #2d3142; --pass: #2f9e63; --fail: #d6453d; }
    body { margin: 0; padding: 24px 16px; background: var(--bg); color: var(--ink);
           font-family: system-ui, -apple-system, "Malgun Gothic", sans-serif; }
    h1 { margin: 0 0 8px; font-size: 22px; }
    #total { font-weight: 700; margin-bottom: 16px; }
    li { margin: 4px 0; list-style: none; }
    .pass::before { content: "✔ "; color: var(--pass); }
    .fail { color: var(--fail); }
    .fail::before { content: "✘ "; }
    pre { margin: 2px 0 0 20px; white-space: pre-wrap; font-size: 13px; }
  </style>
</head>
<body>
  <h1>엔진 테스트</h1>
  <p>이 파일을 브라우저로 열면 <code>js/data.js</code>와 <code>js/engine.js</code>를 자동 검사합니다.</p>
  <div id="total"></div>
  <ul id="results"></ul>

  <script src="../js/data.js"></script>
  <script src="../js/engine.js"></script>
  <script>
    (function () {
      var E = Game.engine;
      // 업체 순서 섞기를 끈다 (random이 항상 0.999면 섞어도 데이터 순서 그대로) — 순서를 기대하는 테스트용
      E.random = function () { return 0.999; };
      var results = [];

      function test(name, fn) {
        try { fn(); results.push({ name: name, ok: true }); }
        catch (e) { results.push({ name: name, ok: false, msg: e.message }); }
      }
      function eq(actual, expected, label) {
        var a = JSON.stringify(actual), b = JSON.stringify(expected);
        if (a !== b) throw new Error((label || "값") + " — 기대 " + b + ", 실제 " + a);
      }
      function throws(fn, label) {
        try { fn(); } catch (e) { return; }
        throw new Error((label || "호출") + "이(가) 오류를 내야 하는데 통과함");
      }
      function clone(o) { return JSON.parse(JSON.stringify(o)); }

      test("시나리오 데이터 검증 통과 (부적격엔 근거, 적격엔 문제 없음)", function () {
        eq(E.validateData(), [], "검증 오류");
      });

      test("서류 자동 검사 결과", function () {
        var p = Game.DATA.projects[0];
        var got = {};
        p.bidders.forEach(function (b) { got[b.id] = E.inspect(p, b).sort(); });
        eq(got, {
          "desk-a": [],
          "desk-b": [],
          "desk-c": ["OVER_BUDGET"],
          "desk-d": ["CERT_EXPIRED", "COLLUSION"],
          "desk-e": ["COLLUSION"]
        }, "검사 결과");
      });

      test("검증이 잘못된 데이터를 잡아냄", function () {
        var bad = clone(Game.DATA);
        var a = bad.projects[0].bidders[0];
        a.docs.quote.unitPrice = 210000; a.docs.quote.total = 42000000;  // 적격인데 예산 초과
        bad.projects[0].bidders[2].docs.quote.total = 39000000;           // 단가×수량 불일치 + 근거 사라짐
        var errors = E.validateData(bad);
        if (!errors.some(function (m) { return m.indexOf("적격 업체인데") !== -1; })) throw new Error("적격 업체 문제를 못 잡음");
        if (!errors.some(function (m) { return m.indexOf("근거가 서류에 없음") !== -1; })) throw new Error("근거 없는 부적격을 못 잡음");
        if (!errors.some(function (m) { return m.indexOf("단가×수량") !== -1; })) throw new Error("견적 계산 오류를 못 잡음");
      });

      test("사유 선택지: 기본 5개 + 이 사업에서 담합 등장", function () {
        E.reset();
        eq(E.availableReasons(), ["OVER_BUDGET", "LATE", "CERT_MISSING", "CERT_EXPIRED", "SPEC_MISMATCH", "COLLUSION"], "사유");
        eq(E.newReason(), "COLLUSION", "새 사유");
      });

      test("모두 맞게 판정 → 실수 0, 적격 2곳이 낙찰 후보, 스타트업 낙찰 시 innovation +1", function () {
        E.reset();
        E.judge("desk-a", "ok");
        E.judge("desk-b", "ok");
        eq(E.judge("desk-c", "reject", "OVER_BUDGET").reasonCorrect, true, "c 사유");
        eq(E.judge("desk-d", "reject", "CERT_EXPIRED").reasonCorrect, true, "d 사유");
        eq(E.judge("desk-e", "reject", "COLLUSION").reasonCorrect, true, "e 사유");
        eq(E.allJudged(), true, "전부 판정");
        eq(E.awardCandidates().map(function (b) { return b.id; }), ["desk-a", "desk-b"], "낙찰 후보");
        E.award("desk-b");
        eq(E.state.tags, { innovation: 1 }, "태그");
        eq(E.state.mistakes, 0, "실수");
        var s = E.summary();
        eq(s.projects[0].awardedName, "새싹디자인랩", "낙찰 업체");
        eq(s.projects[0].news.head, Game.DATA.projects[0].news["desk-b"].head, "뉴스");
        eq(s.topTag, "innovation", "대표 태그");
        eq(E.nextProject().id, "chair", "다음 사업");
        eq(E.isFinished(), false, "아직 진행 중");
      });

      test("사업 5건, 딜레마 태그가 고루 등장", function () {
        var p = Game.DATA.projects;
        eq(p.map(function (x) { return x.id; }), ["desk", "chair", "led", "mask", "gym"], "사업 순서");
        var tags = [];
        p.forEach(function (x) { x.bidders.forEach(function (b) { if (b.tag && tags.indexOf(b.tag) === -1) tags.push(b.tag); }); });
        eq(tags.sort(), ["coexist", "green", "innovation", "quality", "safety", "stable", "thrift"], "태그 종류");
      });

      function playCorrect(E) {
        var p = E.currentProject();
        p.bidders.forEach(function (b) { E.judge(b.id, b.verdict, b.reason); });
        E.award(E.awardCandidates()[0].id);
        E.nextProject();
      }

      test("데이터 순서대로 하면 새 사유가 하나씩 등장 (담합 → 정보 불일치 → 브로커 → 복습 → 중대재해)", function () {
        E.reset();
        var got = [];
        while (!E.isFinished()) {
          got.push([E.newReason(), E.availableReasons().length]);
          playCorrect(E);
        }
        eq(got, [["COLLUSION", 6], ["INFO_MISMATCH", 7], ["BROKER", 8], [null, 8], ["SAFETY", 9]], "사유 등장");
      });

      test("사업은 아무 순서로나 고를 수 있고, 새 사유는 처음 만날 때 소개됨", function () {
        E.reset();
        E.selectProject("mask");
        eq(E.newReasons(), ["INFO_MISMATCH"], "마스크를 먼저 하면 서류 불일치가 새 사유");
        eq(E.projectNumber(), 1, "사업 1번째");
        playCorrect(E);
        eq(E.isDone("mask"), true, "마스크 끝");
        E.selectProject("chair");
        eq(E.newReasons(), [], "의자는 서류 불일치를 이미 봐서 새 사유 없음");
        eq(E.availableReasons().indexOf("INFO_MISMATCH") !== -1, true, "서류 불일치는 계속 선택지에");
        eq(E.projectNumber(), 2, "사업 2번째");
        throws(function () { E.selectProject("mask"); }, "끝낸 사업은 다시 못 고름");
        eq(E.activeProjectId(), null, "판정 전에는 심사 중인 사업 없음");
        E.judge(E.currentProject().bidders[0].id, "ok");
        eq(E.activeProjectId(), "chair", "판정 1곳부터 심사 중");
        throws(function () { E.selectProject("desk"); }, "심사 중엔 다른 사업으로 못 바꿈");
        eq(E.selectProject("chair").id, "chair", "심사 중인 사업은 다시 고를 수 있음 (이어서 하기)");
        playCorrect2(E);
        E.selectProject("gym"); playCorrect(E);
        E.selectProject("desk"); playCorrect(E);
        E.selectProject("led"); playCorrect(E);
        eq(E.isFinished(), true, "5건 끝");
        eq(E.state.mistakes, 0, "자유 순서로도 정답 플레이 가능");
        eq(E.summary().projects.map(function (p) { return p.id; }), ["mask", "chair", "gym", "desk", "led"], "기록은 플레이한 순서");

        function playCorrect2(E) {   // 첫 업체를 이미 판정한 상태에서 마저
          var p = E.currentProject();
          p.bidders.slice(1).forEach(function (b) { E.judge(b.id, b.verdict, b.reason); });
          E.award(E.awardCandidates()[0].id);
          E.nextProject();
        }
      });

      test("5건 연속 정답 플레이 → 실수 0, 낙찰 5건, 태그 5점, 종료", function () {
        E.reset();
        var picks = [];
        while (!E.isFinished()) {
          var p = E.currentProject();
          p.bidders.forEach(function (b) { E.judge(b.id, b.verdict, b.reason); });
          var cand = E.awardCandidates();
          eq(cand.length, 2, p.id + " 낙찰 후보 수");
          E.award(cand[1].id);
          picks.push(cand[1].tag);
          E.nextProject();
        }
        var s = E.summary();
        eq([s.mistakes, s.projects.length], [0, 5], "실수·사업 수");
        eq(s.projects.every(function (x) { return x.news && x.news.head; }), true, "모든 사업에 뉴스");
        var total = 0; for (var t in s.tags) total += s.tags[t];
        eq(total, 5, "태그 합계");
        eq(picks, ["innovation", "quality", "green", "coexist", "safety"], "고른 태그");
        throws(function () { E.nextProject(); }, "끝난 뒤 다음 사업");
      });

      test("서류상 실제로 있는 다른 문제를 사유로 골라도 정답 (반짝가구 = 인증 만료 또는 담합)", function () {
        E.reset();
        eq(E.judge("desk-d", "reject", "COLLUSION").reasonCorrect, true, "d 담합");
      });

      test("판정 실수 기록: 부적격 통과·적격 반려는 실수, 사유만 틀리면 실수 아님", function () {
        E.reset();
        eq(E.judge("desk-c", "ok").mistake, true, "예산 초과 업체 통과");
        eq(E.judge("desk-a", "reject", "LATE").mistake, true, "적격 업체 반려");
        var e = E.judge("desk-e", "reject", "OVER_BUDGET");
        eq([e.mistake, e.reasonCorrect, e.expectedReason], [false, false, "COLLUSION"], "사유만 틀림");
        E.judge("desk-b", "ok");
        E.judge("desk-d", "reject", "CERT_EXPIRED");
        eq(E.state.mistakes, 2, "실수 수");
        eq(E.awardCandidates().map(function (b) { return b.id; }), ["desk-b", "desk-c"], "통과시킨 업체가 후보");
        E.award("desk-c");
        eq(E.state.tags, {}, "부적격 업체 낙찰은 태그 없음");
        eq(E.summary().projects[0].news, null, "부적격 업체 뉴스 없음");
      });

      test("모두 반려하면 유찰만 가능", function () {
        E.reset();
        ["desk-a", "desk-b", "desk-c", "desk-d", "desk-e"].forEach(function (id) { E.judge(id, "reject", "LATE"); });
        eq(E.awardCandidates(), [], "후보 없음");
        throws(function () { E.award("desk-a"); }, "후보 아닌 업체 낙찰");
        eq(E.award(null), null, "유찰");
        eq(E.summary().projects[0].awardedId, null, "요약의 유찰");
      });

      test("잘못된 진행은 오류로 막음", function () {
        E.reset();
        throws(function () { E.judge("desk-c", "reject"); }, "사유 없는 부적격");
        throws(function () { E.judge("desk-c", "reject", "BROKER"); }, "아직 등장 안 한 사유");
        throws(function () { E.judge("nope", "ok"); }, "없는 업체");
        E.judge("desk-a", "ok");
        throws(function () { E.judge("desk-a", "ok"); }, "중복 판정");
        throws(function () { E.award("desk-a"); }, "판정 끝나기 전 낙찰");
        throws(function () { E.nextProject(); }, "낙찰 전 다음 사업");
      });

      test("힌트가 부적격 업체 15곳의 정답 근거 위치를 정확히 가리킴", function () {
        var expected = {
          "desk-c": ["OVER_BUDGET", "quote", ["quote.total"]],
          "desk-d": ["CERT_EXPIRED", "certs", ["certs.0.validUntil"]],
          "desk-e": ["COLLUSION", "quote", ["quote.unitPrice", "quote.note"]],
          "chair-c": ["INFO_MISMATCH", "quote", ["quote.bizNo"]],
          "chair-d": ["SPEC_MISMATCH", "spec", ["spec.armrest"]],
          "chair-e": ["LATE", "application", ["application.submitDate"]],
          "led-c": ["BROKER", "status", ["status.hasOffice", "status.hasFactory", "status.employees"]],
          "led-d": ["CERT_MISSING", "certs", ["certs"]],
          "led-e": ["OVER_BUDGET", "quote", ["quote.total"]],
          "mask-c": ["CERT_EXPIRED", "certs", ["certs.0.validUntil"]],
          "mask-d": ["SPEC_MISMATCH", "spec", ["spec.grade"]],
          "mask-e": ["INFO_MISMATCH", "certs", ["certs.0.bizNo"]],
          "gym-c": ["SAFETY", "status", ["status.seriousAccidents"]],
          "gym-d": ["BROKER", "status", ["status.hasOffice", "status.hasFactory", "status.employees"]],
          "gym-e": ["OVER_BUDGET", "quote", ["quote.total"]]
        };
        var got = {}, okHints = [];
        E.reset();
        Game.DATA.projects.forEach(function (p, i) {
          E.state.projectIndex = i;
          var avail = E.availableReasons();
          p.bidders.forEach(function (b) {
            var h = E.hintFor(p, b, avail);
            if (b.verdict === "reject") got[b.id] = [h.code, h.docKey, h.fields];
            else okHints.push(h.code);
          });
        });
        eq(got, expected, "힌트 위치");
        eq(okHints, [null, null, null, null, null, null, null, null, null, null], "적격 업체는 '수상한 곳 없음'");
      });

      test("힌트 문구에 들어갈 값 (인증 이름·사양 이름·예산)", function () {
        var P = Game.DATA.projects;
        eq(E.locate(P[2], P[2].bidders[3], "CERT_MISSING").vars, { cert: "고효율" }, "LED 인증 누락");
        eq(E.locate(P[1], P[1].bidders[3], "SPEC_MISMATCH").vars, { spec: "팔걸이" }, "의자 사양");
        eq(E.locate(P[0], P[0].bidders[2], "OVER_BUDGET").vars, { budget: "40,000,000원" }, "책상 예산");
        Object.keys(Game.DATA.reasons).forEach(function (code) {
          if (!Game.DATA.narmi.hints[code]) throw new Error("힌트 문구 없음: " + code);
        });
      });

      test("힌트는 사업당 2회, 같은 업체 재사용은 차감 없음, 다음 사업에서 다시 2회", function () {
        E.reset();
        eq(E.hintsLeft(), 2, "시작");
        var h1 = E.useHint("desk-c");
        eq(E.hintsLeft(), 1, "1회 사용");
        eq(E.useHint("desk-c"), h1, "같은 업체는 같은 힌트");
        eq(E.hintsLeft(), 1, "재사용 차감 없음");
        E.useHint("desk-a");
        eq(E.hintsLeft(), 0, "2회 사용");
        throws(function () { E.useHint("desk-b"); }, "횟수 초과");
        Game.DATA.projects[0].bidders.forEach(function (b) { E.judge(b.id, b.verdict, b.reason); });
        E.award("desk-a");
        E.nextProject();
        eq(E.hintsLeft(), 2, "다음 사업 초기화");
        E.useHint("chair-c");
        var s = E.summary();
        eq([s.projects[0].hintsUsed, s.projects[1].hintsUsed, s.hintsUsed], [2, 1, 3], "힌트 사용 집계");
      });

      test("칭호: 최고 칭호 · 감사 지적 0회면 '완벽한' · 동점·없음이면 균형", function () {
        E.reset();
        E.state.tags = { innovation: 2, thrift: 1 }; E.state.mistakes = 0;
        var t = E.title();
        eq([t.full, t.perfect], ["완벽한 혁신 개척자", true], "완벽한 혁신");
        E.state.mistakes = 2;
        eq(E.title().full, "혁신 개척자", "지적 있으면 접두어 없음");
        E.state.tags = { thrift: 1, green: 1 };
        eq(E.title().full, "균형 잡힌 조달관", "동점");
        E.state.tags = {};
        eq(E.title().base, "균형 잡힌 조달관", "태그 없음");
      });

      test("칭호: stable·quality는 같은 '믿음직한 조달관'이라 합쳐서 셈", function () {
        E.reset();
        E.state.tags = { stable: 1, quality: 1, thrift: 1, green: 1 }; E.state.mistakes = 1;
        var end = E.ending();
        eq(end.title, "믿음직한 조달관", "합산 2점이 1등");
        eq(end.blurb, Game.DATA.ending.titleBlurb.stable, "설명 문구");
        eq(end.finalMessage, "조달은 정답 찾기가 아니라, 무엇을 더 소중히 여길지 고르는 일이에요.", "마지막 문구");
      });

      test("엔딩 기사: 적격 낙찰=뉴스 · 유찰=재공고 · 조건 미달 낙찰=감사 기사 · 지적 있으면 정정 기사", function () {
        E.reset();
        var P = Game.DATA.projects;
        // 책상: 예산 초과 업체를 통과시키는 실수 1건, 낙찰은 적격 업체
        P[0].bidders.forEach(function (b) { E.judge(b.id, b.id === "desk-c" ? "ok" : b.verdict, b.id === "desk-c" ? undefined : b.reason); });
        E.award("desk-b"); E.nextProject();
        // 의자: 전부 반려 → 유찰 (적격 2곳 반려 = 실수 2건)
        P[1].bidders.forEach(function (b) { E.judge(b.id, "reject", b.reason || "LATE"); });
        E.award(null); E.nextProject();
        // LED: 브로커 업체를 통과시켜 낙찰 (실수 1건)
        P[2].bidders.forEach(function (b) { E.judge(b.id, b.id === "led-c" ? "ok" : b.verdict, b.id === "led-c" ? undefined : b.reason); });
        E.award("led-c"); E.nextProject();

        var a = E.ending().articles;
        eq(a.map(function (x) { return x.kind; }), ["news", "failed", "badAward"], "기사 종류");
        eq(a[0].head, P[0].news["desk-b"].head, "적격 낙찰 뉴스");
        eq(a[1].head.indexOf(P[1].title) === 0, true, "유찰 기사에 사업명");
        eq(a.map(function (x) { return !!x.correction; }), [true, true, true], "정정 기사");
        eq(a[1].correction.indexOf("2건") !== -1, true, "정정 기사에 지적 수");
        eq(E.ending().title.indexOf("완벽한"), -1, "지적 있으면 '완벽한' 없음");
      });

      test("성향 태그 동점·없음이면 balanced", function () {
        E.reset();
        eq(E.topTag(), "balanced", "태그 없음");
        E.state.tags = { thrift: 2, green: 2 };
        eq(E.topTag(), "balanced", "동점");
        E.state.tags = { thrift: 1, green: 3 };
        eq(E.topTag(), "green", "최고 태그");
      });

      test("판정 복기: 상태·근거 서류·조건표 칸 (담합은 두 업체 견적서)", function () {
        E.reset();
        var p = E.currentProject();
        p.bidders.forEach(function (b) {
          if (b.id === "desk-a") E.judge(b.id, "reject", "OVER_BUDGET");   // 적격을 반려
          else if (b.verdict === "reject" && b.reason === "OVER_BUDGET") E.judge(b.id, "ok");   // 부적격 통과
          else E.judge(b.id, b.verdict, b.reason);
        });
        var r = E.review("desk", "desk-a");
        eq(r.status, "wrong", "적격 반려 → 실수");
        eq(r.picked, "OVER_BUDGET", "고른 사유");
        eq(r.papers[0].docKey, "quote", "고른 사유의 서류(견적서)");
        eq(r.condFields.join(), "cond.budget", "조건표 예산 상한");

        var over = p.bidders.filter(function (b) { return b.reason === "OVER_BUDGET"; })[0];
        r = E.review("desk", over.id);
        eq(r.status, "wrong", "부적격 통과 → 실수");
        eq(r.papers[0].fields.join(), "quote.total", "견적 총액에 형광펜");

        var col = p.bidders.filter(function (b) { return b.reason === "COLLUSION"; })[0];
        r = E.review("desk", col.id);
        eq(r.status, "right", "담합 정답");
        eq(r.papers.length, 2, "두 업체 견적서");
        eq(r.papers[0].bidderId, col.collusionWith, "담합 상대가 먼저");

        r = E.review("desk", "desk-b");
        eq(r.status, "right", "적격 통과 정답");
        eq(r.papers.length, 0, "근거 서류 없음");
      });

      test("업체 순서는 판마다 섞이고, 담합 업체는 항상 담합 상대 뒤", function () {
        E.random = Math.random;
        var orders = {};
        for (var n = 0; n < 40; n++) {
          E.reset();
          Game.DATA.projects.forEach(function (p) {
            var ids = E.orderedBidders(p.id).map(function (b) { return b.id; });
            eq(ids.slice().sort(), p.bidders.map(function (b) { return b.id; }).sort(), p.id + " 업체 5곳 그대로");
            p.bidders.forEach(function (b) {
              if (b.collusionWith && ids.indexOf(b.collusionWith) > ids.indexOf(b.id)) throw new Error(p.id + ": 담합 업체가 상대보다 먼저 옴 " + ids.join());
            });
            eq(E.orderedBidders(p.id).map(function (b) { return b.id; }), ids, p.id + " 한 판 안에서는 순서 고정");
            if (p.id === "desk") orders[ids.join()] = true;
          });
        }
        E.random = function () { return 0.999; };
        if (Object.keys(orders).length < 5) throw new Error("40판 중 순서가 " + Object.keys(orders).length + "가지뿐 — 잘 안 섞임");
      });

      test("이어하기: 끝낸 사업까지 저장·복원, 진행 중이던 사업은 처음부터, 잘못된 저장은 거부", function () {
        E.reset();
        E.selectProject("mask"); playCorrect(E);
        E.selectProject("desk");
        var d = E.currentProject();
        E.judge(d.bidders[2].id, "ok");                 // 부적격 통과 → 실수 1
        E.judge(d.bidders[0].id, "ok"); E.judge(d.bidders[1].id, "ok");
        E.judge(d.bidders[3].id, "reject", d.bidders[3].reason); E.judge(d.bidders[4].id, "reject", d.bidders[4].reason);
        E.award(d.bidders[1].id); E.nextProject();
        E.selectProject("gym"); E.judge(E.currentProject().bidders[0].id, "ok");   // 진행 중
        var save = JSON.parse(JSON.stringify(E.exportSave()));
        var want = { done: E.state.done.slice(), mistakes: E.state.mistakes, tags: JSON.stringify(E.state.tags), seen: E.state.seenReasons.slice() };

        E.reset();
        eq(E.importSave(save), true, "복원");
        eq(E.state.done, want.done, "끝낸 사업");
        eq(E.state.mistakes, 1, "감사 지적");
        eq(JSON.stringify(E.state.tags), want.tags, "태그");
        eq(E.state.seenReasons, want.seen, "소개된 사유");
        eq(E.projectNumber(), 3, "다음은 3번째 사업");
        eq(E.judgmentsOf("gym"), {}, "진행 중이던 사업 판정은 지워짐");
        eq(E.summary().projects.map(function (p) { return p.id; }), ["mask", "desk"], "심사 기록");
        E.selectProject("gym"); playCorrect(E);   // 이어서 진행 가능
        eq(E.state.done.length, 3, "이어서 진행");

        E.reset();
        eq(E.importSave(null), false, "저장 없음");
        eq(E.importSave({ v: 999, state: save.state, projectIds: save.projectIds }), false, "형식 버전 다름");
        eq(E.importSave({ v: save.v, state: save.state, projectIds: ["x"] }), false, "시나리오 바뀜");
        eq(E.importSave({ v: save.v, state: { done: [] }, projectIds: save.projectIds }), false, "끝낸 사업 없음");
      });

      var passed = results.filter(function (r) { return r.ok; }).length;
      var total = document.getElementById("total");
      total.textContent = passed + " / " + results.length + " 통과";
      total.className = passed === results.length ? "pass" : "fail";
      var ul = document.getElementById("results");
      results.forEach(function (r) {
        var li = document.createElement("li");
        li.className = r.ok ? "pass" : "fail";
        li.textContent = r.name;
        if (!r.ok) {
          var pre = document.createElement("pre");
          pre.textContent = r.msg;
          li.appendChild(pre);
        }
        ul.appendChild(li);
      });
      window.TEST_RESULTS = { passed: passed, total: results.length, results: results };
    })();
  </script>
</body>
